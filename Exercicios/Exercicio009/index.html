<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Trabalhando com Listas</h1>
    <h2>Listas ordenadas</h2>
    <ol type="1" start="1">
        <li>Acordar</li>
        <li>Ligar para o João</li>
        <li>Tomar café</li>
        <li>Escovar os dentes</li>
        <li>Ir para a faculdade</li>
        <li>Almoçar</li>
        <li>Estudar</li>
        <li>Voltar para casa</li>
    </ol>

    <h2>Lista não ordenadas</h2>

    <ul type="disc">
        <li>Pão</li>
        <li>Carne</li>
    </ul>
    <ul type="circle">
        <li>Manteiga</li>
    </ul>
    <ul type="square">
        <li>Requeijão</li>
    </ul>

</body>
</html>
