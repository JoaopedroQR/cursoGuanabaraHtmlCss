<!DOCTYPE html>
<html lang="py-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Vídeos em HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedando no meu prórprio servidor</p>
    <video width="560" height="315" poster="Imagens/foto jp.jpg" controls autoplay loop>
        <source src="midias/Meuvideo2.mp4" type="video/mp4">
        <source src="midias/Meuvideo2.m4v" type="video/mp4">
        <source src="midias/Meuvideo2.webm" type="video/webm">
        <source src="midias/Meuvideo2.ogv" type="video/ogg">
        <p>Seu navegar não tem compatibilidade com reprodução de vídeos</p>
    </video>
    
    <h1>Inserindo vídeos do youtube</h1>
    
    <iframe width="560" height="315" src="https://www.youtube.com/embed/6qFe0MoFZaU?si=HDbab67otn6K7TBi" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h1>Inserindo videos do vimeo</h1>

    <iframe title="vimeo-player" src="https://player.vimeo.com/video/126328238?h=9f19887541" width="640" height="360" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"   allowfullscreen></iframe>
</body>
</html>
