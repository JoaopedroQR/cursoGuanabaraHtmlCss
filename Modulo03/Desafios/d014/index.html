<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio02</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            border-collapse: collapse;
            text-align: center;
        }

        td{
            border: 1px solid black;
            padding: 10px;
        }

        .destaque{
            background-color: gray;
            color: white;
            font-weight: bold;
            text-align: center;
        }
    </style>

</head>
<body>
    <table>
        <thead class="destaque">
            <tr>
                <td rowspan="2" scope="col">Área</td>
                <td rowspan="2" scope="col">Disciplinas</td>
                <td colspan="2" scope="colgroup">notas</td>
                <td rowspan="2" scope="col">média</td>
            </tr>
            <tr>
                <td scope="col">Nota 1</td>
                <td scope="col">Nota 2</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="4" scope="rowgroup">Exatas</td>
                <td>matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
                
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
                
            </tr>
            
            <tr class="destaque">
                <td colspan="4" style="text-align: left;">médias de Exatas</td>
                <td style="text-align: center;">0.0</td>
            </tr>
            
            <tr>
                <td rowspan="2" scope="rowgroup">Humanas</td>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            
            <tr class="destaque">
                <td colspan="4" style="text-align: left;">médias de Humanas</td>
                <td>0.0</td>
            </tr>
            
        </tbody>
    </table>
</body>
</html>
