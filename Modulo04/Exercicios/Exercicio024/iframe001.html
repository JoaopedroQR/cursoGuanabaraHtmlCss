<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe{
            width: 400px;
            height: 400px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 
        <!-- tamanho padrao 300x150s     -->
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" scolling="no">
            <!-- [ Seu navegador não é compatível com isso] -->
             <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
        </iframe>
        
        para aprender a programar</p>

    <p>
        O site do
        
        <iframe src="https://www.zurieducacao.com.br/auth" frameborder="0" height="500" width="500">
            <a href="https://www.zurieducacao.com.br/auth" target="_blank">zuriAI</a>
        </iframe>
        
        também é muito legal
    </p>
</body>
</html>
