<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>

        @font-face {
            font-family: 'Cherish';
            src: url('fonts/Cherish Free.otf') format('opentype'), url('fonts/Cherish Free.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            /*
                Tipos de format()
                - opentype (otf)
                - truetype (ttf)
                - embedded-opentype
                truetype-aat (Apple advanced Typography)
                - svg
            */
        }
        @font-face {
            font-family: 'Love';
            src: url(fonts/love\ story\ ttf.ttf) format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body{
            font-family: Love, Arial, Helvetica, sans-serif;
        }
        h1{
            font-family: Cherish, 'Times New Roman', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Est minima eos vel hic exercitationem placeat dolore, nesciunt repellat debitis dolor officia possimus commodi quo quasi, corrupti quos. Odio, excepturi officia?</p>

</body>
</html>
